name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      # `node --test <explicit-dir>` is unreliable in this Node version for
      # non-cwd-relative paths (resolves as a module specifier, not a test
      # glob). Bare `node --test` auto-discovers recursively from cwd
      # instead — scope it to just the frontend by cd'ing there, so this
      # job doesn't need backend's dependencies installed at all.
      - run: node --test
        working-directory: frontend
